<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #0b0e14; --panel: #121722; --panel-2: #171d2a; --line: #232b3b;
    --text: #e6e9ef; --muted: #8a94a7; --faint: #5b6577;
    --accent: #7c9cff; --green: #34d399; --amber: #fbbf24; --red: #f87171; --slate: #64748b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 Inter, system-ui, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }

  .shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
  .nav { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column;
    gap: 2px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; padding: 4px 8px 18px; color: var(--text); }
  .brand:hover { text-decoration: none; }
  .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #7c9cff, #a78bfa); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-item:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
  .nav-item.on { background: var(--panel-2); color: var(--text); }
  .nav-item.on svg { color: var(--accent); }
  .nav-item .badge { margin-left: auto; font-size: 11px; font-weight: 600; min-width: 20px; text-align: center; padding: 1px 6px;
    border-radius: 999px; background: rgba(251,191,36,.15); color: var(--amber); }
  .nav-item .badge:empty { display: none; }
  .nav-sep { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; padding: 18px 10px 6px; }
  .nav .nav-item.ext { font-size: 13px; }
  .topbar { display: flex; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--bg);
    position: sticky; top: 0; z-index: 5; min-height: 48px; }
  .brain-status { color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 800px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .nav { position: sticky; z-index: 6; height: auto; flex-direction: row; align-items: center; flex-wrap: wrap; padding: 10px 16px; gap: 4px;
      border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { padding: 0 8px 0 0; } .nav-sep { display: none; } .nav .nav-item.ext { display: none; }
    .topbar { position: static; padding: 10px 16px; }
  }

  main { max-width: 1240px; margin: 0 auto; padding: 24px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 12px; font-weight: 600; }
  h2:first-child { margin-top: 0; }

  .needs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .need { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .need .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .need .head b { font-size: 13px; }
  .need .n { font-size: 22px; font-weight: 700; }
  .need ul { list-style: none; margin: 0; padding: 0; }
  .need li { font-size: 12px; padding: 4px 0; border-top: 1px solid var(--line); color: var(--muted); }
  .need li a { color: var(--text); }
  .need .none { font-size: 12px; color: var(--faint); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
    cursor: pointer; transition: border-color .15s, transform .15s; display: flex; flex-direction: column; gap: 10px; }
  .card:hover { border-color: var(--faint); transform: translateY(-1px); }
  .card.idle { opacity: .6; }
  .card-top { display: flex; gap: 12px; align-items: center; }
  .avatar { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #0b0e14; flex-shrink: 0; }
  .card-title { font-weight: 600; font-size: 15px; }
  .card-role { color: var(--muted); font-size: 12px; }
  main.wide { max-width: 1480px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
  .side-col { position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow-y: auto; }
  @media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } .side-col { position: static; max-height: none; } }
  .side-panel { padding: 10px 14px; }
  .side-sub { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; padding: 6px 0; cursor: default; }
  details.paused-group summary { cursor: pointer; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
  details.paused-group .sched { opacity: .65; }
  .sched { display: block; padding: 9px 0; border-top: 1px solid var(--line); color: var(--text); }
  .sched:hover { text-decoration: none; background: var(--panel-2); }
  .sched-when { font-size: 12px; color: var(--accent); font-weight: 500; }
  details .sched-when { color: var(--muted); }
  .sched-name { font-size: 13px; font-weight: 500; margin: 1px 0; }
  .sched-meta { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .routine-line { font-size: 12px; color: var(--muted); }
  .mission { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.green { color: var(--green); border-color: rgba(52,211,153,.35); }
  .chip.amber { color: var(--amber); border-color: rgba(251,191,36,.35); }
  .chip.red { color: var(--red); border-color: rgba(248,113,113,.35); }
  .chip.accent { color: var(--accent); border-color: rgba(124,156,255,.35); }
  .stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .stats b { color: var(--text); font-size: 14px; display: block; }
  .conn { display: flex; gap: 5px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.linked { background: var(--green); } .dot.external { background: var(--amber); } .dot.missing { background: var(--slate); }

  /* Detail */
  .back { color: var(--muted); font-size: 13px; cursor: pointer; display: inline-block; margin-bottom: 14px; }
  .detail-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .detail-head .avatar { width: 56px; height: 56px; font-size: 22px; border-radius: 14px; }
  .detail-head h1 { margin: 0; font-size: 22px; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
  .tab { padding: 9px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count { font-size: 11px; color: var(--faint); margin-left: 4px; }
  .two { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
  .panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .conn-list { display: flex; flex-direction: column; gap: 10px; }
  .conn-item { display: flex; gap: 10px; align-items: flex-start; }
  .conn-item .dot { margin-top: 6px; }
  .conn-item small { display: block; color: var(--muted); font-size: 12px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
  .table-wrap { overflow-x: auto; }

  .md { overflow-wrap: anywhere; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 22px 0 8px; }
  .md h3 { font-size: 14px; }
  .md p, .md li { color: #c9cfdb; }
  .md code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--panel-2); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { margin: 10px 0; font-size: 13px; }
  .md blockquote { border-left: 3px solid var(--line); margin: 0; padding-left: 12px; color: var(--muted); }
  .fm { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 12px; margin-bottom: 14px;
    padding: 12px; background: var(--panel-2); border-radius: 8px; }
  .fm dt { color: var(--faint); } .fm dd { margin: 0; }
  .empty { color: var(--faint); padding: 24px; text-align: center; font-size: 13px; }
  .notice { background: rgba(251,191,36,.07); border: 1px solid rgba(251,191,36,.25); color: #e9d8a6; border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .err { color: var(--red); }
  /* Pull requests */
  .page-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .page-head h1 { margin: 0; font-size: 22px; }
  .page-head .sub { color: var(--muted); font-size: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 12px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted);
    background: var(--panel); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { color: var(--text); border-color: var(--faint); text-decoration: none; }
  .btn.primary { color: #0b0e14; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { color: #0b0e14; filter: brightness(1.1); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .filters .chip { cursor: pointer; font-size: 12px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 6px; }
  .filters .chip:hover { color: var(--text); text-decoration: none; }
  .filters .chip.on { color: var(--text); border-color: var(--faint); background: var(--panel-2); }
  .prs { display: flex; flex-direction: column; gap: 10px; }
  .pr { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .pr.stale { border-left: 3px solid var(--amber); }
  .pr-main { display: flex; gap: 14px; padding: 14px 16px; align-items: flex-start; }
  .pr-main .avatar { width: 34px; height: 34px; font-size: 14px; border-radius: 9px; }
  .pr-body { flex: 1; min-width: 0; }
  .pr-title { font-weight: 600; font-size: 14.5px; color: var(--text); }
  .pr-meta { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .pr-meta .mono { color: var(--faint); overflow-wrap: anywhere; }
  .add { color: var(--green); } .del { color: var(--red); }
  .pr-side { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0; }
  .pr details { border-top: 1px solid var(--line); }
  .pr summary { cursor: pointer; padding: 9px 16px; color: var(--muted); font-size: 12px; }
  .pr summary:hover { color: var(--text); }
  .pr-detail { padding: 0 16px 14px; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
  .pr-files { font-size: 12px; } .pr-files div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .pr-files .mono { overflow-wrap: anywhere; color: #c9cfdb; }
  @media (max-width: 760px) { .pr-main { flex-wrap: wrap; } .pr-side { flex-direction: row; align-items: center; width: 100%; padding-left: 48px; }
    .pr-detail { grid-template-columns: minmax(0, 1fr); } }

  /* Videos */
  .vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .vid { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .vid-frame { position: relative; aspect-ratio: 9 / 16; background: #000; cursor: pointer; display: grid; place-items: center; }
  .vid-frame img, .vid-frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .vid-frame .play { position: relative; width: 52px; height: 52px; border-radius: 50%; background: rgba(11,14,20,.65);
    border: 1px solid rgba(255,255,255,.25); display: grid; place-items: center; transition: transform .15s; }
  .vid-frame:hover .play { transform: scale(1.08); }
  .vid-frame .play svg { width: 20px; height: 20px; margin-left: 3px; fill: #fff; }
  .vid-frame .noposter { position: absolute; bottom: 10px; font-size: 11px; color: var(--faint); }
  .vid-info { padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .vid-title { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
  .vid-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .vid-note { color: #c9cfdb; font-size: 12px; background: var(--panel-2); border-radius: 8px; padding: 7px 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .vid-note.review { border-left: 2px solid var(--amber); }
  .vid-links { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; }

  @media (max-width: 600px) { main { padding: 16px; } .vids { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grid, .needs { grid-template-columns: minmax(0, 1fr); } .pr-side { padding-left: 0; } }
  .brain-status { min-width: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="shell">
<nav class="nav">
  <a class="brand" href="#"><div class="logo"></div>Agent Hub</a>
  <a class="nav-item" data-page="agents" href="#">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="1.75" width="5" height="5" rx="1.2"/><rect x="9.25" y="1.75" width="5" height="5" rx="1.2"/><rect x="1.75" y="9.25" width="5" height="5" rx="1.2"/><rect x="9.25" y="9.25" width="5" height="5" rx="1.2"/></svg>
    Agents</a>
  <a class="nav-item" data-page="prs" href="#/prs">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="4" cy="3.5" r="1.75"/><circle cx="4" cy="12.5" r="1.75"/><circle cx="12" cy="12.5" r="1.75"/><path d="M4 5.25v5.5M12 10.75V6.5a2 2 0 0 0-2-2H7.5M9 3l-1.5 1.5L9 6"/></svg>
    Pull requests<span class="badge" id="pr-badge" title="Open brain PRs"></span></a>
  <a class="nav-item" data-page="videos" href="#/videos">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1.75" y="3.25" width="9" height="9.5" rx="1.5"/><path d="M10.75 6.75l3.5-2v6.5l-3.5-2z"/></svg>
    Videos<span class="badge" id="video-badge" title="Videos waiting for review"></span></a>
  <div class="nav-sep">Consoles</div>
  <a class="nav-item ext" href="http://localhost:18792" target="_blank" rel="noopener">OpenClaw ↗</a>
  <a class="nav-item ext" href="http://localhost:9119" target="_blank" rel="noopener">Hermes ↗</a>
</nav>
<div class="content">
  <div class="topbar"><div class="brain-status" id="brain-status">Loading…</div></div>
  <main id="app"><div class="empty">Loading…</div></main>
</div>
</div>

<script>
const $app = document.getElementById('app')
const PALETTE = ['#7c9cff', '#34d399', '#fbbf24', '#f472b6', '#a78bfa', '#22d3ee', '#fb923c', '#a3e635']
let overview = null

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const md = s => DOMPurify.sanitize(marked.parse(s || ''))
const colorFor = slug => PALETTE[[...slug].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % PALETTE.length]
const avatar = a => `<div class="avatar" style="background:${colorFor(a.slug)}">${esc((a.name || a.slug)[0].toUpperCase())}</div>`
const ago = iso => {
  if (!iso) return '—'
  const d = (Date.now() - new Date(iso)) / 1000
  if (d < 3600) return Math.max(1, Math.round(d / 60)) + 'm ago'
  if (d < 86400) return Math.round(d / 3600) + 'h ago'
  return Math.round(d / 86400) + 'd ago'
}
const STATUS_CHIP = { todo: '', running: 'accent', in_review: 'amber', done: 'green', failed: 'red', cancelled: '',
  pending: 'amber', paused: 'amber', accepted: 'green', rejected: 'red', active: 'green', superseded: '', archived: '' }
const statusChip = s => `<span class="chip ${STATUS_CHIP[s] || ''}">${esc((s || 'unknown').replace('_', ' '))}</span>`
const statusBadge = st => st === 'idle' ? '<span class="chip">idle</span>'
  : st === 'paused' ? '<span class="chip amber">paused</span>'
  : st === 'retired' ? '<span class="chip red">retired</span>' : '<span class="chip green">active</span>'
const fmtRun = iso => iso ? new Date(iso).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' }) + ' PT' : '—'
function routineLine(a) {
  if (!a.routines) return '<span style="color:var(--faint)">No routines.md yet</span>'
  const rs = a.routines.routines, act = rs.filter(r => r.active)
  if (!rs.length) return 'No routines'
  const next = act.map(r => r.nextRun).filter(Boolean).sort()[0]
  return `${rs.length} routine${rs.length > 1 ? 's' : ''} · ${act.length ? `${act.length} active · next ${fmtRun(next)}` : '<span style="color:var(--amber)">all paused</span>'}`
}
const RUNG = { 1: 'monitor', 2: 'propose', 3: 'supervised drafts', 4: 'live writes' }

function splitFrontmatter(text) {
  const m = text.match(/^---\n([\s\S]*?)\n---\n?/)
  if (!m) return [[], text]
  const rows = m[1].split('\n').map(l => l.match(/^([\w-]+):\s*(.*)$/)).filter(Boolean).map(x => [x[1], x[2]])
  return [rows, text.slice(m[0].length)]
}

async function getJSON(url) {
  const r = await fetch(url)
  if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`)
  return r.json()
}

function renderBrainStatus(b) {
  const parts = [`<span>brain <code>${esc(b.branch || '?')}</code> @ <code>${esc(b.commit || '?')}</code> · ${ago(b.committedAt)}</span>`]
  if (b.behind) parts.push(`<span class="chip amber" title="Run git pull in ~/brain">${b.behind} commits behind origin</span>`)
  if (b.ahead) parts.push(`<span class="chip accent">${b.ahead} local commits not pushed</span>`)
  parts.push(`<span title="When this server last fetched from GitHub">last fetch ${ago(b.lastFetch)}</span>`)
  document.getElementById('brain-status').innerHTML = parts.join('')
}

// ── Overview ───────────────────────────────────────────────────────────
function needBox(title, items, line, emptyMsg) {
  return `<div class="need"><div class="head"><b>${title}</b><span class="n">${items.length}</span></div>
    ${items.length ? `<ul>${items.slice(0, 6).map(line).join('')}</ul>` : `<div class="none">${emptyMsg}</div>`}</div>`
}
const recLink = r => `<a href="#/agent/${esc(r.agent)}/file/${encodeURIComponent(r.path)}">${esc(r.title)}</a>`

function renderOverview() {
  const { agents, needs } = overview
  const order = { active: 0, paused: 1, idle: 2, retired: 3 }
  const sorted = [...agents].sort((x, y) => (order[x.status] ?? 1) - (order[y.status] ?? 1))
  const tally = Object.entries(agents.reduce((t, a) => (t[a.status] = (t[a.status] || 0) + 1, t), {}))
    .sort((x, y) => (order[x[0]] ?? 1) - (order[y[0]] ?? 1)).map(([k, n]) => `${n} ${k}`).join(', ')
  $app.innerHTML = `<div class="layout"><div class="main-col">
    <h2>Needs you</h2>
    <div class="needs">
      ${needBox('Proposals awaiting your decision', needs.proposals, r => `<li>${recLink(r)} · ${esc(r.agentName)}</li>`, 'Nothing pending')}
      ${needBox('Checks due', needs.due, r => `<li>${recLink(r)} · ${esc(r.agentName)} · due ${esc(r.checkAt)}</li>`, 'No task is past its checkAt')}
      ${needBox('Stuck tasks', needs.stuck, r => `<li>${recLink(r)} · ${esc(r.agentName)}</li>`, 'Nothing running over 14 days')}
      <div class="need" id="need-prs"><div class="head"><b>Brain PRs to merge</b><span class="n">…</span></div></div>
      <div class="need" id="need-videos"><div class="head"><b>Videos to review</b><span class="n">…</span></div></div>
    </div>
    <h2>Agents · ${tally}</h2>
    <div class="grid">${sorted.map(card).join('') || '<div class="empty">No agent folders in brain/agents/</div>'}</div>
    </div><aside class="side-col"><h2>Schedule</h2>${scheduleList(overview.schedule)}</aside></div>`
}

function scheduleList(rows) {
  if (!rows.length) return '<div class="panel empty">No routines recorded in any agents/*/routines.md</div>'
  const item = r => `<a class="sched" href="#/agent/${esc(r.agent)}/routines">
    <div class="sched-when">${r.active ? esc(fmtRun(r.nextRun)) : esc(r.plain)}</div>
    <div class="sched-name">${esc(r.name)}</div>
    <div class="sched-meta"><span class="dot" style="background:${colorFor(r.agent)}"></span>${esc(r.agentName)}${r.active ? ` · ${esc(r.plain)}` : ''}</div></a>`
  const act = rows.filter(r => r.active), off = rows.filter(r => !r.active)
  return `<div class="panel side-panel">
    <div class="side-sub">Upcoming · ${act.length}</div>
    ${act.map(item).join('') || '<div class="none" style="color:var(--faint);font-size:12px;padding:6px 0">Nothing scheduled</div>'}
    ${off.length ? `<details class="paused-group"${act.length ? '' : ' open'}><summary class="side-sub">Paused · ${off.length}</summary>${off.map(item).join('')}</details>` : ''}
  </div>`
}

function card(a) {
  const tc = a.taskCounts
  const open = (tc.todo || 0) + (tc.running || 0) + (tc.in_review || 0)
  return `<div class="card ${a.status === 'idle' || a.status === 'retired' ? 'idle' : ''}" onclick="location.hash='#/agent/${esc(a.slug)}'">
    <div class="card-top">${avatar(a)}<div><div class="card-title">${esc(a.name)}</div><div class="card-role">${esc(a.role || a.slug)}</div></div></div>
    <div class="chips">
      ${statusBadge(a.status)}
      ${a.runtime ? `<span class="chip">${esc(a.runtime)}</span>` : ''}
      ${a.rung ? `<span class="chip accent" title="${esc(RUNG[a.rung] || '')}">rung ${esc(a.rung)}</span>` : ''}
      ${a.reportsTo ? `<span class="chip">→ ${esc(a.reportsTo)}</span>` : ''}
      ${a.metricSet ? '' : '<span class="chip amber">no success metric</span>'}
    </div>
    <div class="routine-line">${routineLine(a)}</div>
    <div class="mission">${esc(a.mission.replace(/\*\*|`/g, ''))}</div>
    <div class="chips">${a.connections.map(c => `<span class="conn chip" title="${esc(c.detail)}"><span class="dot ${c.state}"></span>${esc(c.label)}</span>`).join('')}</div>
    <div class="stats">
      <div><b>${open}</b>open tasks</div><div><b>${tc.done || 0}</b>done</div>
      <div><b>${a.activeLearnings}</b>learnings</div><div><b>${a.pendingProposals.length}</b>proposals</div>
    </div>
  </div>`
}

// ── Agent detail ───────────────────────────────────────────────────────
async function renderAgent(slug, tab, filePath) {
  let a
  try { a = await getJSON(`/api/agent?slug=${encodeURIComponent(slug)}`) }
  catch (e) { $app.innerHTML = `<div class="empty err">${esc(e.message)}</div>`; return }
  tab = filePath ? 'file' : (tab || 'overview')
  const r = a.records
  const tabs = [['overview', 'Overview'], ['tasks', 'Tasks', r.tasks.length], ['learnings', 'Learnings', r.learnings.length],
    ['proposals', 'Proposals', r.proposals.length], ['routines', 'Routines', a.routines ? a.routines.routines.length : 0], ['activity', 'Activity'], ['files', 'Files', a.files.length]]
  $app.innerHTML = `
    <span class="back" onclick="location.hash=''">← All agents</span>
    <div class="detail-head">${avatar(a)}<div>
      <h1>${esc(a.name)}</h1><div class="card-role">${esc(a.role)}</div>
      <div class="meta-row">
        ${statusBadge(a.status)}
        ${a.runtime ? `<span class="chip">${esc(a.runtime)}</span>` : ''}
        ${a.rung ? `<span class="chip accent">rung ${esc(a.rung)} · ${esc(RUNG[a.rung] || '')}</span>` : ''}
        ${a.owner ? `<span class="chip">owner ${esc(a.owner)}</span>` : ''}
        ${a.reportsTo ? `<span class="chip">reports to ${esc(a.reportsTo)}</span>` : ''}
        ${a.updatedAt ? `<span class="chip">updated ${esc(a.updatedAt)}</span>` : ''}
      </div></div></div>
    <div class="tabs">${tabs.map(([k, label, n]) =>
      `<div class="tab ${k === tab ? 'on' : ''}" onclick="location.hash='#/agent/${esc(slug)}/${k}'">${label}${n != null ? `<span class="count">${n}</span>` : ''}</div>`).join('')}
      ${tab === 'file' ? '<div class="tab on">File</div>' : ''}</div>
    <div id="tab-body"></div>`
  const body = document.getElementById('tab-body')

  if (tab === 'overview') {
    const s = a.sections
    const block = (h) => s[h] ? `<h2>${esc(h)}</h2>${md(s[h])}` : ''
    body.innerHTML = `<div class="two">
      <div class="panel md">${block('Mission')}${block('Success metric')}${block('Cadence')}${block('May write')}
        ${!s['Mission'] ? '<div class="empty">agent.md has no Mission section</div>' : ''}</div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="panel"><h3>Connections</h3><div class="conn-list">${a.connections.map(c =>
          `<div class="conn-item"><span class="dot ${c.state}"></span><div>${esc(c.label)}<small>${esc(c.detail)}</small></div></div>`).join('')}</div></div>
        <div class="panel"><h3>Needs attention</h3>${
          [...a.pendingProposals.map(p => `<div>Proposal: <a href="#/agent/${esc(slug)}/file/${encodeURIComponent(p.path)}">${esc(p.title)}</a></div>`),
           ...a.due.map(t => `<div>Check due ${esc(t.checkAt)}: <a href="#/agent/${esc(slug)}/file/${encodeURIComponent(t.path)}">${esc(t.title)}</a></div>`),
           ...a.stuck.map(t => `<div>Stuck: <a href="#/agent/${esc(slug)}/file/${encodeURIComponent(t.path)}">${esc(t.title)}</a></div>`)].join('')
          || '<div class="none" style="color:var(--faint);font-size:12px">Nothing</div>'}</div>
      </div></div>`
  } else if (tab === 'tasks' || tab === 'learnings' || tab === 'proposals') {
    const rows = r[tab]
    const extra = tab === 'tasks' ? ['Priority', 'checkAt'] : ['checkAt']
    body.innerHTML = rows.length ? `<div class="panel table-wrap"><table>
      <tr><th>Title</th><th>Status</th>${extra.map(h => `<th>${h}</th>`).join('')}<th>Created</th></tr>
      ${rows.map(x => `<tr class="click" onclick="location.hash='#/agent/${esc(slug)}/file/${encodeURIComponent(x.path)}'">
        <td>${esc(x.title)}<div class="mono" style="color:var(--faint)">${esc(x.path)}</div></td><td>${statusChip(x.status)}</td>
        ${tab === 'tasks' ? `<td>${esc(x.priority)}</td>` : ''}<td>${esc(x.checkAt || '—')}</td><td>${esc(x.createdAt || x.modified.slice(0, 10))}</td></tr>`).join('')}
      </table></div>` : `<div class="panel empty">No ${tab} yet. They appear here when the agent writes to agents/${esc(slug)}/${tab}/</div>`
  } else if (tab === 'routines') {
    const R = a.routines
    if (!R) { body.innerHTML = `<div class="panel empty">No routines.md yet. Each agent records its scheduled jobs in agents/${esc(slug)}/routines.md (template: agents/_templates/routines.md)</div>`; return }
    body.innerHTML = `
      <div class="panel table-wrap" style="margin-bottom:16px">
        <div style="color:var(--muted);font-size:12px;margin-bottom:8px">Recorded in routines.md, updated ${esc(R.updatedAt || '?')}. The runtime holds the live copy; this is what was last written to brain.</div>
        <table><tr><th>Routine</th><th>Schedule</th><th>Window</th><th>Status</th><th>Next run</th></tr>
        ${R.routines.map(x => `<tr><td>${esc(x.name)}<div class="mono" style="color:var(--faint)">${esc(x.id)}</div></td>
          <td>${esc(x.plain)}<div class="mono" style="color:var(--faint)">${esc(x.cron)}</div></td><td>${esc(x.window)}</td>
          <td>${statusChip(x.active ? 'active' : 'paused')}<div style="color:var(--faint);font-size:12px">${esc(x.active || x.status.toLowerCase() === 'paused' ? '' : x.status)}</div></td>
          <td style="white-space:nowrap">${x.active ? esc(fmtRun(x.nextRun)) : '—'}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No routines</td></tr>'}
        </table></div>
      ${R.routines.filter(x => x.prompt).map(x => `<details class="panel" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:500">Prompt: ${esc(x.name)}</summary>
        <pre class="mono" style="white-space:pre-wrap;margin:12px 0 0;color:#c9cfdb">${esc(x.prompt)}</pre></details>`).join('')}
      ${R.changelog.length ? `<div class="panel" style="margin-top:16px"><h3>Change log</h3><div class="md">${md(R.changelog.map(l => '- ' + l).join('\n'))}</div></div>` : ''}`
  } else if (tab === 'files') {
    body.innerHTML = `<div class="panel">${a.files.map(f => `<div style="padding:6px 0;border-bottom:1px solid var(--line)">
      <a class="mono" href="#/agent/${esc(slug)}/file/${encodeURIComponent(f)}">${esc(f)}</a></div>`).join('') || '<div class="empty">No files</div>'}</div>`
  } else if (tab === 'activity') {
    body.innerHTML = '<div class="panel empty">Loading…</div>'
    const act = await getJSON(`/api/activity?agent=${encodeURIComponent(a.name)}`)
    if (!act.connected) {
      body.innerHTML = `<div class="notice">The activity log isn't connected on this server yet. Agents write every run step to
        <code>agent_logs</code> in the Geeko Supabase project (<code>knowledge/agent-building/activity-log.md</code>).
        To show it here, add <code>SUPABASE_LOGS_URL</code> and a read key <code>SUPABASE_LOGS_READ_KEY</code> to
        <code>~/agent-hub/.env</code> and restart the hub.</div>`
    } else if (act.error) {
      body.innerHTML = `<div class="panel err">Couldn't read the activity log: ${esc(act.error)}</div>`
    } else {
      body.innerHTML = act.rows.length ? `<div class="panel table-wrap"><table>
        <tr><th>When</th><th>Action</th><th>Result</th><th>What</th></tr>
        ${act.rows.map(x => `<tr><td style="white-space:nowrap">${esc(new Date(x.created_at).toLocaleString())}</td><td>${esc(x.action || '')}</td>
          <td>${statusChip(x.result || x.status)}</td><td><b>${esc(x.task_description || '')}</b>
          <div style="color:var(--muted);font-size:12px;white-space:pre-wrap">${esc(x.details || '')}</div>
          ${x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.link)}</a>` : ''}</td></tr>`).join('')}
        </table></div>` : `<div class="panel empty">Connected, but no rows for "${esc(a.name)}" yet.</div>`
    }
  } else if (tab === 'file') {
    body.innerHTML = '<div class="panel empty">Loading…</div>'
    const res = await fetch(`/api/file?slug=${encodeURIComponent(slug)}&path=${encodeURIComponent(filePath)}`)
    if (!res.ok) { body.innerHTML = `<div class="panel err">Can't open ${esc(filePath)}</div>`; return }
    const [fm, text] = splitFrontmatter(await res.text())
    body.innerHTML = `<div class="panel md"><div class="mono" style="color:var(--faint);margin-bottom:10px">agents/${esc(slug)}/${esc(filePath)}</div>
      ${fm.length ? `<dl class="fm">${fm.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}${md(text)}</div>`
  }
}

// ── Pull requests ──────────────────────────────────────────────────────
let prsData = null
const STALE_PR_DAYS = 2
const MERGE_STATE = { CLEAN: ['green', 'ready to merge'], HAS_HOOKS: ['green', 'ready to merge'], UNSTABLE: ['amber', 'checks failing'],
  BLOCKED: ['amber', 'blocked'], BEHIND: ['amber', 'behind main'], DIRTY: ['red', 'conflicts'], UNKNOWN: ['', 'checking mergeability'] }

async function loadPRs(force) {
  prsData = await getJSON('/api/prs' + (force ? '?refresh=1' : ''))
  const open = prsData.prs.filter(p => p.state === 'OPEN').length
  document.getElementById('pr-badge').textContent = open || ''
  return prsData
}

// Bots all open PRs under one GitHub account, so the server reads the agent off the branch name
function prAgent(p) {
  const a = overview && overview.agents.find(x => x.slug === p.agent)
  return a ? { slug: a.slug, name: a.name, known: true }
    : { slug: p.agent || 'other', name: p.agent ? p.agent[0].toUpperCase() + p.agent.slice(1) : 'Other' }
}
const isStale = p => p.state === 'OPEN' && (Date.now() - new Date(p.createdAt)) / 86400000 > STALE_PR_DAYS
const sizeLine = p => `${p.changedFiles} file${p.changedFiles === 1 ? '' : 's'} · <span class="add">+${p.additions}</span> <span class="del">−${p.deletions}</span>`

async function fillPRNeed() {
  const box = document.getElementById('need-prs')
  if (!box) return
  try {
    const open = (await loadPRs()).prs.filter(p => p.state === 'OPEN')
    if (!document.body.contains(box)) return
    box.outerHTML = needBox('Brain PRs to merge', open,
      p => `<li><a href="#/prs">#${p.number} ${esc(p.title)}</a> · ${esc(prAgent(p).name)} · ${ago(p.createdAt)}</li>`, 'No open PRs')
  } catch (e) { box.querySelector('.n').textContent = '?' }
}

function prCard(p) {
  const a = prAgent(p)
  const [cls, label] = p.isDraft ? ['', 'draft'] : (MERGE_STATE[p.mergeStateStatus] || ['', (p.mergeStateStatus || '').toLowerCase()])
  return `<div class="pr ${isStale(p) ? 'stale' : ''}" ${isStale(p) ? `title="Open more than ${STALE_PR_DAYS} days"` : ''}>
    <div class="pr-main">${avatar(a)}
      <div class="pr-body">
        <a class="pr-title" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        <div class="pr-meta"><span>#${p.number}</span>
          ${a.known ? `<a href="#/agent/${esc(a.slug)}">${esc(a.name)}</a>` : `<span>${esc(a.name)}</span>`}
          <span title="${esc(new Date(p.createdAt).toLocaleString())}">opened ${ago(p.createdAt)}</span>
          <span>${sizeLine(p)}</span><span class="mono">${esc(p.headRefName)}</span></div>
      </div>
      <div class="pr-side">
        <span class="chip ${cls}">${esc(label)}</span>
        <a class="btn primary" href="${esc(p.url)}/files" target="_blank" rel="noopener">Review on GitHub ↗</a>
      </div>
    </div>
    <details><summary>Description and files</summary>
      <div class="pr-detail">
        <div class="md">${p.body ? md(p.body) : '<span style="color:var(--faint)">No description.</span>'}</div>
        <div class="pr-files">${(p.files || []).map(f => `<div><span class="mono">${esc(f.path)}</span>
          <span style="white-space:nowrap"><span class="add">+${f.additions}</span> <span class="del">−${f.deletions}</span></span></div>`).join('')}</div>
      </div></details>
  </div>`
}

async function renderPRs(filter, force) {
  if (!prsData || force) $app.innerHTML = '<div class="empty">Loading pull requests…</div>'
  let data
  try { data = await loadPRs(force) } catch (e) { $app.innerHTML = `<div class="empty err">${esc(e.message)}</div>`; return }
  if (data.error) { $app.innerHTML = `<div class="panel err">Couldn't read brain's PRs with the gh CLI on this server: ${esc(data.error)}</div>`; return }
  const all = data.prs
  const counts = all.reduce((t, p) => (t[prAgent(p).slug] = (t[prAgent(p).slug] || 0) + 1, t), {})
  const shown = filter ? all.filter(p => prAgent(p).slug === filter) : all
  const open = shown.filter(p => p.state === 'OPEN'), closed = shown.filter(p => p.state !== 'OPEN')
  const repoUrl = all.length ? all[0].url.replace(/\/pull\/\d+$/, '') : 'https://github.com/TheGeekosaurus/brain'
  $app.innerHTML = `
    <div class="page-head"><div><h1>Pull requests</h1>
      <div class="sub"><span>brain · ${all.filter(p => p.state === 'OPEN').length} open · updated ${ago(data.fetchedAt)}</span></div></div>
      <div class="sub"><button class="btn" id="pr-refresh">Refresh</button>
        <a class="btn" href="${esc(repoUrl)}/pulls" target="_blank" rel="noopener">All on GitHub ↗</a></div></div>
    <div class="filters">
      <a class="chip ${filter ? '' : 'on'}" href="#/prs">All · ${all.length}</a>
      ${Object.entries(counts).sort((x, y) => y[1] - x[1]).map(([slug, n]) => {
        const a = prAgent({ agent: slug === 'other' ? '' : slug })
        return `<a class="chip ${filter === slug ? 'on' : ''}" href="#/prs/${esc(slug)}"><span class="dot" style="background:${colorFor(slug)}"></span>${esc(a.name)} · ${n}</a>`
      }).join('')}
    </div>
    <h2>Waiting for you · ${open.length}</h2>
    ${open.length ? `<div class="prs">${open.map(prCard).join('')}</div>`
      : '<div class="panel empty">No open PRs. Everything the bots opened has been merged or closed.</div>'}
    <h2>Recently merged and closed</h2>
    ${closed.length ? `<div class="panel table-wrap"><table>
      <tr><th>Pull request</th><th>Agent</th><th>State</th><th>When</th><th>Size</th></tr>
      ${closed.map(p => `<tr><td><a href="${esc(p.url)}" target="_blank" rel="noopener">#${p.number} ${esc(p.title)}</a>
          <div class="mono" style="color:var(--faint)">${esc(p.headRefName)}</div></td>
        <td style="white-space:nowrap"><span class="conn"><span class="dot" style="background:${colorFor(prAgent(p).slug)}"></span>${esc(prAgent(p).name)}</span></td>
        <td>${p.state === 'MERGED' ? '<span class="chip green">merged</span>' : '<span class="chip red">closed</span>'}</td>
        <td style="white-space:nowrap" title="${esc(new Date(p.mergedAt || p.closedAt).toLocaleString())}">${ago(p.mergedAt || p.closedAt)}</td>
        <td style="white-space:nowrap;font-size:12px">${sizeLine(p)}</td></tr>`).join('')}
      </table></div>` : '<div class="panel empty">Nothing yet.</div>'}`
  document.getElementById('pr-refresh').onclick = () => renderPRs(filter, true)
}

// ── Videos (review queue) ──────────────────────────────────────────────
const VIDEO_STATUSES = [['pending', 'To review'], ['approved', 'Approved'], ['changes_requested', 'Changes requested'], ['rejected', 'Rejected'], ['all', 'All']]
const VIDEO_CHIP = { pending: 'amber', approved: 'green', rejected: 'red', changes_requested: 'amber' }
const PLAY_ICON = '<svg viewBox="0 0 16 16"><path d="M3 1.8v12.4L13.5 8z"/></svg>'

async function loadVideos() {
  const data = await getJSON('/api/videos')
  document.getElementById('video-badge').textContent = data.videos.filter(v => v.status === 'pending').length || ''
  return data
}

async function fillVideoNeed() {
  const box = document.getElementById('need-videos')
  try {
    const data = await loadVideos()
    if (!document.body.contains(box)) return
    const pending = data.videos.filter(v => v.status === 'pending')
    box.outerHTML = needBox('Videos to review', pending,
      v => `<li><a href="#/videos">${esc(v.title)}</a> · ${esc(v.account || v.agent_name)} · ${ago(v.created_at)}</li>`,
      data.missingTable ? 'Review queue not set up yet' : 'Nothing waiting')
  } catch (e) { if (box) box.querySelector('.n').textContent = '?' }
}

function videoCard(v) {
  const id = esc(v.drive_file_id)
  const airtable = v.airtable_base && v.airtable_table && v.airtable_record_id
    ? `https://airtable.com/${encodeURIComponent(v.airtable_base)}/${encodeURIComponent(v.airtable_table)}/${encodeURIComponent(v.airtable_record_id)}` : ''
  return `<div class="vid">
    <div class="vid-frame" data-id="${id}" title="Play">
      <span class="noposter">no preview yet</span>
      <img src="/api/video-thumb?id=${id}" alt="" loading="lazy" onerror="this.remove()">
      <span class="play">${PLAY_ICON}</span>
    </div>
    <div class="vid-info">
      <div class="vid-title">${esc(v.title)}</div>
      <div class="chips">
        <span class="chip ${VIDEO_CHIP[v.status] || ''}">${esc((v.status || '').replace('_', ' '))}</span>
        <span class="chip">${esc(v.stage)}</span>
      </div>
      <div class="vid-meta">${[v.account, v.product].filter(Boolean).map(esc).join(' · ') || esc(v.business || '')}</div>
      <div class="vid-meta"><span class="dot" style="background:${colorFor((v.agent_name || '').toLowerCase())}"></span> ${esc(v.agent_name)} · ${ago(v.created_at)}</div>
      ${v.notes ? `<div class="vid-note">${esc(v.notes)}</div>` : ''}
      ${v.reviewer_note ? `<div class="vid-note review">${esc(v.reviewer_note)}</div>` : ''}
      <div class="vid-links">
        <a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">Drive ↗</a>
        ${airtable ? `<a href="${esc(airtable)}" target="_blank" rel="noopener">Airtable ↗</a>` : ''}
        ${v.clickup_task_id ? `<a href="https://app.clickup.com/t/${esc(v.clickup_task_id)}" target="_blank" rel="noopener">ClickUp ↗</a>` : ''}
      </div>
    </div>
  </div>`
}

async function renderVideos(status, account) {
  status = status || 'pending'
  $app.innerHTML = '<div class="empty">Loading videos…</div>'
  let data
  try { data = await loadVideos() } catch (e) { $app.innerHTML = `<div class="empty err">${esc(e.message)}</div>`; return }
  const head = `<div class="page-head"><div><h1>Videos</h1>
    <div class="sub">Videos the bots put up for review. Files stay in Drive and play from there.</div></div></div>`
  if (!data.connected || data.missingTable) {
    $app.innerHTML = `${head}<div class="notice">The review queue isn't set up yet. Run the SQL in
      <code>knowledge/agent-building/video-reviews.md</code> in the Supabase SQL editor for the agents project,
      then have the bots submit videos with <code>submit_video_for_review</code>.</div>`
    return
  }
  if (data.error) { $app.innerHTML = `${head}<div class="panel err">Couldn't read the review queue: ${esc(data.error)}</div>`; return }
  const all = data.videos
  const byStatus = status === 'all' ? all : all.filter(v => v.status === status)
  const accounts = Object.entries(byStatus.reduce((t, v) => (t[v.account || 'other'] = (t[v.account || 'other'] || 0) + 1, t), {}))
  const shown = account ? byStatus.filter(v => (v.account || 'other') === account) : byStatus
  const count = s => s === 'all' ? all.length : all.filter(v => v.status === s).length
  $app.innerHTML = `${head}
    <div class="tabs">${VIDEO_STATUSES.map(([k, label]) =>
      `<div class="tab ${k === status ? 'on' : ''}" onclick="location.hash='#/videos/${k}'">${label}<span class="count">${count(k)}</span></div>`).join('')}</div>
    ${accounts.length > 1 ? `<div class="filters">
      <a class="chip ${account ? '' : 'on'}" href="#/videos/${status}">All accounts · ${byStatus.length}</a>
      ${accounts.sort((x, y) => y[1] - x[1]).map(([a, n]) =>
        `<a class="chip ${account === a ? 'on' : ''}" href="#/videos/${status}/${encodeURIComponent(a)}">${esc(a)} · ${n}</a>`).join('')}</div>` : ''}
    ${shown.length ? `<div class="vids">${shown.map(videoCard).join('')}</div>`
      : `<div class="panel empty">${status === 'pending' ? 'Nothing waiting for review.' : 'No videos here.'}</div>`}`
  $app.querySelectorAll('.vid-frame').forEach(f => f.addEventListener('click', () => {
    if (f.querySelector('video')) return
    $app.querySelectorAll('.vid-frame video').forEach(other => other.pause())
    f.innerHTML = `<video src="/api/video-stream?id=${encodeURIComponent(f.dataset.id)}" controls autoplay playsinline></video>`
    f.removeAttribute('title')
  }))
}

// ── Router ─────────────────────────────────────────────────────────────
async function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/')
  const page = ['prs', 'videos'].includes(parts[0]) ? parts[0] : 'agents'
  document.querySelectorAll('.nav-item[data-page]').forEach(n => n.classList.toggle('on', n.dataset.page === page))
  try {
    overview = await getJSON('/api/overview')
    renderBrainStatus(overview.brain)
  } catch (e) { $app.innerHTML = `<div class="empty err">Can't reach the hub server: ${esc(e.message)}</div>`; return }
  if (page === 'prs') {
    await renderPRs(parts[1] ? decodeURIComponent(parts[1]) : '')
    loadVideos().catch(() => {})
  } else if (page === 'videos') {
    await renderVideos(parts[1], parts[2] ? decodeURIComponent(parts[2]) : '')
    loadPRs().catch(() => {})
  } else if (parts[0] === 'agent' && parts[1]) {
    const filePath = parts[2] === 'file' ? decodeURIComponent(parts.slice(3).join('/')) : null
    await renderAgent(parts[1], filePath ? null : parts[2], filePath)
    loadPRs().catch(() => {}); loadVideos().catch(() => {})
  } else { renderOverview(); fillPRNeed(); fillVideoNeed() }
  $app.classList.toggle('wide', !(parts[0] === 'agent' && parts[1]))
  window.scrollTo(0, 0)
}
window.addEventListener('hashchange', route)
route()
</script>
</body>
</html>
